# Unprivileged pull request analysis.
# Reads event metadata and runs the repository checks.
# Does not call an LLM, publish a comment, or request write permissions.

name: PR Review Focus

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-review-focus-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  review-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Type-check
        run: npm run type-check
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Lint
        run: npm run lint
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Test
        run: npm test
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Report pull request metadata
        run: node dist/github/report-pull-request-event.js
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_EVENT_PATH: ${{ github.event_path }}
