# Trusted manual workflow for another repository.
# Checks out this repository's selected ref and uses the GitHub App installation
# token to read and comment on the repository named in the inputs. It does not
# check out that repository.

name: Review another repository

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Account that owns the other repository
        required: true
        type: string
      repository:
        description: Repository name, without the account
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: review-another-repository-${{ inputs.owner }}/${{ inputs.repository }}-${{ inputs.pull_request }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-metadata: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review the other repository
        run: node dist/reanalyze-pull-request.js
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ""
          GITHUB_REPOSITORY: ${{ inputs.owner }}/${{ inputs.repository }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
