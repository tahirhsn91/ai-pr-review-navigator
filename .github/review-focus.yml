# Review focus policy. criticality is read by semantic analysis.
# selection limits the prioritization summary. This file does not publish a review.
version: 1
selection:
  maxBlocks: 12
  minBand: medium
ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/*.lock"
  - "**/package-lock.json"
languages:
  - typescript
  - javascript
attention:
  - public_api
  - control_flow
  - error_handling
  - data_shape
  - concurrency
  - security_boundary
  - wide_span
  - cross_file_coupling
criticality:
  - "Payment capture changes what a customer is charged."
  - "Authorization checks control access to an account."
